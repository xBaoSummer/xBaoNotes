[package]
name = "xbao-notes"
version = "0.1.0"
description = "A local Windows sticky notes app."
authors = ["xBao"]
license = "MIT"
repository = "https://github.com/xBaoSummer/xBaoNotes"
edition = "2021"

[lib]
name = "xbao_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
